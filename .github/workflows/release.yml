name: Release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to publish @sphyra/js to npmjs, GitHub Releases, and GitHub Packages'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: Guard
    runs-on: ubuntu-latest
    steps:
      - name: Require main and confirm=publish
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Release must run from main. Merge the PR first, then run this workflow on main."
            exit 1
          fi
          if [ "${CONFIRM}" != "publish" ]; then
            echo "Type publish in the confirm input to proceed."
            exit 1
          fi
        env:
          GITHUB_REF: ${{ github.ref }}
          CONFIRM: ${{ inputs.confirm }}

  test:
    name: Test
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  npmjs:
    name: npmjs
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Publish to npmjs
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

  github-release:
    name: GitHub Release
    needs: npmjs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release create "v${VERSION}" \
            --title "@sphyra/js v${VERSION}" \
            --generate-notes \
            --target "${GITHUB_SHA}"

  github-packages:
    name: GitHub Packages
    needs: npmjs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@sphyra"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Publish to GitHub Packages
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
